---
# k8s/frontend-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fms-frontend
  namespace: fms
  labels:
    app: fms-frontend
    tier: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fms-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: fms-frontend
        tier: web
    spec:
      containers:
        - name: fms-frontend
          image: ghcr.io/your-org/fms-frontend:latest   # Replace with your registry
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 30
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: fms-frontend-service
  namespace: fms
  labels:
    app: fms-frontend
spec:
  selector:
    app: fms-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: ClusterIP

---
# k8s/ingress.yaml
# Requires ingress-nginx controller: kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/cloud/deploy.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fms-ingress
  namespace: fms
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # cert-manager auto TLS (install cert-manager first)
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - app.yourfranchise.com
      secretName: fms-tls
  rules:
    - host: app.yourfranchise.com
      http:
        paths:
          # API routes → backend
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: fms-backend-service
                port:
                  number: 4000
          # All other routes → frontend SPA
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fms-frontend-service
                port:
                  number: 80
