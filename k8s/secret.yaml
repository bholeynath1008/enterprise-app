---
# k8s/secret.yaml
# IMPORTANT: In production, use Sealed Secrets, Vault, or AWS Secrets Manager
# Never commit real secrets to git — use placeholder values here
# and inject real values via CI/CD pipeline (e.g., GitHub Actions secrets)
apiVersion: v1
kind: Secret
metadata:
  name: fms-secrets
  namespace: fms
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_WITH_REAL_SECRET_IN_CI"
  ENCRYPTION_KEY: "REPLACE_WITH_REAL_32_CHAR_KEY_IN_CI"
  # Future: DB_URL: "postgresql://user:pass@postgres-service:5432/fms"
