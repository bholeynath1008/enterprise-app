version: '3.9'

# ============================================================
# FMS Full-Stack Docker Compose
# Usage: docker-compose up --build
# Frontend: http://localhost:3000
# Backend:  http://localhost:4000
# ============================================================

services:
  # ---- Backend API ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fms-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-fms_dev_secret_2025}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-fms_aes_key_32chars_dev_only_123}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - fms-network

  # ---- Frontend ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:4000
        VITE_APP_ENV: production
        VITE_APP_VERSION: "2.0.0"
    container_name: fms-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - fms-network

networks:
  fms-network:
    driver: bridge

